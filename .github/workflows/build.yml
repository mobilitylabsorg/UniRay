# Builds the app for Linux (AppImage), Windows (installer + portable zip),
# macOS (DMG, Apple Silicon and Intel) and Android (APK), and the MikroTik
# gateway container (armv7, arm64). Every run uploads the packages as workflow
# artifacts; a pushed `v*` tag also publishes them as a GitHub release.
#
# macOS signing: without secrets the app is unsigned, and macOS refuses to
# open it straight from a download (see README). To sign and notarize, add
# APPLE_CERTIFICATE (the .p12, base64), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (an app-specific password)
# and APPLE_TEAM_ID; Tauri picks them up by these names.
#
# Android signing: without secrets the APK is signed with a throwaway debug
# key, so each build installs only over itself. For updates that install over
# each other, add these repository secrets:
#   ANDROID_KEYSTORE           the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (used for the key too)
#   ANDROID_KEY_ALIAS          the key's alias

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (AppImage)
    # The oldest supported runner: an AppImage runs on systems at least as new
    # as the glibc it was built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Sidecars (Xray, helper)
        run: bash scripts/prepare-sidecars.sh --release

      # Includes the tests that run generated configs through the real Xray.
      - name: Tests
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          UNIRAY_XRAY_BIN=$PWD/src-tauri/binaries/uniray-xray-$triple \
          XRAY_LOCATION_ASSET=$PWD/src-tauri/resources \
          cargo test --workspace

      - name: Build
        run: pnpm tauri build --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: uniray-linux
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Sidecars (Xray, Wintun, helper)
        shell: bash
        run: bash scripts/prepare-sidecars.sh --release

      - name: Build
        run: pnpm tauri build --bundles nsis

      # The same files the installer puts down, for running without installing.
      - name: Portable zip
        shell: pwsh
        run: |
          $release = "target/release"
          $out = "portable/UniRay"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$release/uniray.exe", "$release/uniray-xray.exe", "$release/uniray-helper.exe", "$release/wintun.dll", "$release/LICENSE-Wintun" $out
          Copy-Item -Recurse "$release/resources" $out
          Compress-Archive -Path $out -DestinationPath "portable/UniRay-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: uniray-windows
          path: |
            target/release/bundle/nsis/*.exe
            portable/*.zip
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes `tools`, which the SDK repository no
          # longer has. The platform and build tools come with the Gradle build.
          packages: platform-tools
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Xray for Android (libXray, stealth binary, geo files)
        run: |
          bash scripts/fetch-libxray-android.sh
          bash scripts/fetch-xray-android.sh

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No ANDROID_KEYSTORE secret: the APK is signed with a debug key."
            exit 0
          fi
          android=src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > "$android/keystore.properties"

      # arm64 only: the stealth mode's standalone Xray is an arm64 binary, and
      # that covers practically every phone in use.
      - name: Build
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect
        run: |
          mkdir -p apk
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk apk/UniRay-android-arm64.apk
          ls -l apk

      - uses: actions/upload-artifact@v4
        with:
          name: uniray-android
          path: apk/*.apk
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          # Built on the Apple Silicon runner as well: Rust and the Xcode
          # toolchain cross-compile to Intel.
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - name: Sidecars (Xray, helper)
        run: bash scripts/prepare-sidecars.sh --release ${{ matrix.target }}

      # Tauri signs and notarizes when these are set; an empty one would make
      # it try and fail, so only the ones that exist are passed on.
      - name: Signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret: the app is left unsigned."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              { echo "$name<<__END__"; echo "$value"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Collect
        run: |
          mkdir -p dmg
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dmg/UniRay-macos-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: uniray-macos-${{ matrix.arch }}
          path: dmg/*.dmg
          if-no-files-found: error

  gateway:
    name: MikroTik gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: docker/setup-buildx-action@v3

      # Images RouterOS imports as files: build/uniray-gateway-<arch>.tar.
      - name: Build
        run: bash scripts/build-gateway.sh linux/arm/v7 linux/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: uniray-gateway
          path: build/uniray-gateway-*.tar
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
